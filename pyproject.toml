[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leanselect"
version = "0.1.0"
description = "Efficient long-context prefill with lightweight selection"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
dependencies = [
    "torch==2.11.0",
    "transformers==4.56.0",
    "numpy==2.1.3",
    "safetensors>=0.4.5,<1",
    "einops>=0.8,<0.9",
    "sentencepiece>=0.2,<0.3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
cpu = ["torch==2.11.0"]
cuda = ["torch==2.11.0"]
eval = [
    "datasets==2.14.4",
    "fsspec[http]==2023.6.0",
    "pyarrow==18.1.0",
    "rouge==1.0.1",
    "rouge-score==0.1.2",
    "fuzzywuzzy==0.18.0",
    "jieba==0.42.1",
    "nltk>=3.9,<4",
]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/Xnhyacinth/LeanSelect"
Issues = "https://github.com/Xnhyacinth/LeanSelect/issues"

[tool.setuptools.packages.find]
include = ["leanselect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
link-mode = "copy"
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", extra = "cpu"},
    {index = "pytorch-cu128", extra = "cuda"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
